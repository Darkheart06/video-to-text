name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install what the library code needs
        # Whisper, sherpa-onnx и pywebview тянуть незачем: они нужны только на
        # самом маке во время работы, а импортируются лениво.
        run: |
          python -m pip install --upgrade pip
          pip install numpy ruff

      - name: Ruff
        run: ruff check .

      - name: Byte-compile everything
        run: python -m compileall -q app tools

      - name: Import the modules that must work anywhere
        run: |
          python - <<'PY'
          import importlib

          for name in ("app.settings", "app.presets", "app.compute",
                       "app.summarize", "app.render", "app.cleanup",
                       "app.merge", "app.library", "app.i18n", "app.dates",
                       "app.edits"):
              importlib.import_module(name)
          print("imports ok")
          PY

      - name: Check the parts that never touch the model
        # Арифметика в сметах, разбор разделов и перевод — чистые функции, их
        # можно проверить без звука, моделей и мака. Язык задаём явно: на
        # сборочной машине системный язык английский, и без этого проверка
        # ловила бы не поломку, а перевод.
        run: |
          python - <<'PY'
          from app import compute, dates, i18n, presets, summarize
          from datetime import date

          i18n.use("ru")

          answer = "\n".join([
              "## Работы",
              "| Работа | Количество | Единица | Ставка | Стоимость |",
              "|---|---|---|---|---|",
              "| Демонтаж | 12 | час | 3 000 | |",
              "| Вывоз мусора | | рейс | 7 500 | |",
          ])

          result = compute.process(answer, "Смета", "ru")
          table = result.tables[0]
          assert table.total == 12 * 3000 + 7500, table.total
          assert "**Итого**" in result.markdown
          assert ";3000;36000" in compute.to_csv(result.tables, "ru")

          sections = summarize.parse_sections(result.markdown, presets.RU["estimate"].sections)
          assert "works" in sections, sections

          custom = presets.build_custom("правила", "", "ru")
          assert len(custom.sections) >= 2

          # Английская сторона: те же функции, другой язык.
          english = compute.process(
              "| Job | Quantity | Rate | Amount |\n|---|---|---|---|\n| Demo | 4 | 25 | |\n",
              "Estimate", "en")
          assert "**Total**" in english.markdown
          assert english.tables[0].total == 100, english.tables[0].total
          assert presets.builtin("en")["meeting"].sections[0][1] == "Summary"
          assert "(August 28)" in dates.process(
              "| Task | Deadline |\n|---|---|\n| Ship | tomorrow |\n", date(2026, 8, 27), "en")

          # Словарь полон: пустой перевод — это забытая строка.
          missing = [key for key, row in {**i18n.MESSAGES, **i18n.DOCUMENT}.items()
                     if not row.get("ru") or not row.get("en")]
          assert not missing, missing

          print("checks ok")
          PY

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: models output
